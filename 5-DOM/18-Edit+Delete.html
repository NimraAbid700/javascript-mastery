<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background-color: #212121; color: #fff">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    function addLanguage(langName) {
        const li = document.createElement('li');
        li.innerHTML = `${langName}` // not optimized approach
        document.querySelector('.language').
        appendChild(li)
    }
    addLanguage("python")
    addLanguage("typescript")

    function addOptimizeLang(langName) {
        const li = document.createElement('li');
        // const addText = document.createTextNode(langName)
        // li.appendChild(addText)
        li.appendChild(document.createTextNode(langName)) // optimized approach
        document.querySelector('.language').appendChild(li)
    }
    addOptimizeLang('react')

    // Edit
    const secondLang = document.querySelector('li:nth-child(2)')
    console.log(secondLang); 
    // secondLang.innerHTML = 'English' not appropriate 
    const newli = document.createElement('li')
    newli.textContent = 'English'
    secondLang.replaceWith(newli)

    // Edit 
    const firstLang = document.querySelector('li:first-child')
    firstLang.outerHTML = '<li>bootstrap</li>'

    // remove
    const lastLang = document.querySelector('li:last-child')
    lastLang.remove()
</script>
</html>
