<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NodeList</title>
</head>
<body style="background-color: #212121; color: #fff">
    <script>
        const div = document.createElement('div')
        console.log(div);
        div.className = 'main'
        div.id = Math.round(Math.random() * 10 + 1)
        div.setAttribute("title", "generated title") // setAttribute values ko set kr de ga while baqi sb innertext, className, id pehle values ko le kr aaty then uss ko overwrite kr ke set krty.
        div.style.backgroundColor = 'green'
        div.style.padding = '12px'
        // div.innerText = 'Chai aur Code 1'
        const addText = document.createTextNode("Chai aur Code")
        div.appendChild(addText)

        document.body.appendChild(div)
    </script>
</body>
</html>
